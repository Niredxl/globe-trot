{% extends "base.html" %}

{% block styles %}
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/itinerary_view.css') }}">
{% endblock %}

{% block content %}

<div class="wireframe-container">

    <div class="top-bar attached">
        <span class="brand">GlobalTrotter</span>
        <span class="profile-circle"></span>
    </div>

    <div class="container-body">

        <div class="search-controls">
            <input type="text" class="search-input" placeholder="Search bar .....">

            <div class="control-buttons">
                <button>Group by</button>
                <button>Filter</button>
                <button>Sort by...</button>
            </div>
        </div>

        <h4 class="page-title">Itinerary for a selected place</h4>

        <div class="itinerary-header">
            <div></div>
            <div class="header-activity">Physical Activity</div>
            <div class="header-expense">Expense</div>
        </div>

        <div class="day-grid">
            <div class="day-label">Day 1</div>

            <div class="activity-stack">
                <div class="activity-box"></div>
                <div class="arrow">↓</div>
                <div class="activity-box"></div>
                <div class="arrow">↓</div>
                <div class="activity-box"></div>
            </div>

            <div class="expense-stack">
                <div class="expense-box"></div>
                <div class="expense-box"></div>
                <div class="expense-box"></div>
            </div>
        </div>

        <div class="day-grid">
            <div class="day-label">Day 2</div>

            <div class="activity-stack">
                <div class="activity-box"></div>
                <div class="arrow">↓</div>
                <div class="activity-box"></div>
                <div class="arrow">↓</div>
                <div class="activity-box"></div>
            </div>

            <div class="expense-stack">
                <div class="expense-box"></div>
                <div class="expense-box"></div>
                <div class="expense-box"></div>
            </div>
        </div>

    </div>
</div>

{% endblock %}
