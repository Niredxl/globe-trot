{% extends "base.html" %}
{% block styles %}
    <script src="{{ url_for('static', filename='js/builditi.js')}}" defer></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/builditi.css') }}">
{% endblock %}
{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold">Build Your Itinerary</h2>
                <span class="badge bg-primary rounded-pill px-3 py-2">Trip ID: {{ trip_id }} </span>
            </div>

            <form action="#" method="POST">
                <div id="itinerary-sections">
                    
                    <div class="card shadow-sm border-0 rounded-4 mb-4 itinerary-stop">
                        <div class="card-header bg-white border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
                            <h5 class="fw-bold text-primary mb-0 stop-label">Stop 1: Destination Details</h5>
                            <button type="button" class="btn-close remove-stop-btn" aria-label="Remove Stop"></button>
                        </div>
                        <div class="card-body p-4">
                            <div class="row g-3">
                                <div class="col-12 mb-2">
                                    <label class="form-label fw-semibold">City / Destination</label>
                                    <input type="text" name="city[]" class="form-control rounded-3" placeholder="e.g., Paris, France" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Activities & Notes</label>
                                    <textarea name="description[]" class="form-control rounded-3" rows="3" 
                                              placeholder="Enter details about travel, hotel, activities, etc."></textarea>
                                </div>
                                <div class="col-md-7">
                                    <label class="form-label fw-semibold">Duration</label>
                                    <div class="input-group">
                                        <input type="date" name="start_date[]" class="form-control" required>
                                        <span class="input-group-text bg-light">to</span>
                                        <input type="date" name="end_date[]" class="form-control" required>
                                    </div>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label fw-semibold">Estimated Budget ($)</label>
                                    <input type="number" name="budget[]" class="form-control" placeholder="0.00">
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="text-center mb-5">
                    <button type="button" id="add-stop-btn" class="btn btn-outline-primary rounded-pill px-4">
                        <i class="bi bi-plus-circle me-2"></i>＋ Add another Stop
                    </button>
                </div>

                <div class="card shadow border-0 rounded-4 p-4 bg-light">
                    <div class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-3">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5 shadow-sm">Save Itinerary</button>
                        <a href="#">Discard Changes</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
