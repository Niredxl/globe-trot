{% extends "base.html" %}
{% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %} 
{% block content %}
<form method="POST" class="login-form">
    <img src="{{ url_for('static', filename='img/user.png') }}" class="profile-pic">
    <div class="mb-3">
        <label for="exampleFormControlInput1" class="form-label">Email address</label>
        <input name="email" type="email" class="form-control" id="exampleFormControlInput1" placeholder="email">
    </div>
    <div class="password">
            <label for="inputPassword5" class="form-label">Password</label>
            <input name="password" type="password" id="inputPassword5" class="form-control" aria-describedby="passwordHelpBlock">
            <div id="passwordHelpBlock" class="form-text">Your password must be 8-20 characters long, contain letters and numbers, and must not contain spaces, special characters, or emoji.</div>
    </div>
    <button type="submit" class="btn btn-primary mb-3">Login</button> 
</form>  

{% endblock %}
